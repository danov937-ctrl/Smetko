# Автоматично качване на сайта в SuperHosting при всяка промяна в клон main.
# Нужни са 3 тайни (Settings → Secrets and variables → Actions):
#   FTP_SERVER   – напр. smetko.com (или сървърът от имейла на SuperHosting)
#   FTP_USERNAME – потребителското име за cPanel
#   FTP_PASSWORD – паролата за cPanel
name: Качване в SuperHosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v4

      - name: Качване по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public_html/
          server-dir: ./public_html/
