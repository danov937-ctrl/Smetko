# Автоматично качване на сайта в SuperHosting при всяка промяна в клон main.
# Нужни са 3 тайни (Settings → Secrets and variables → Actions):
#   FTP_SERVER   – london.superhosting.bg
#   FTP_USERNAME – FTP акаунт от cPanel → FTP Accounts, напр. github@smetko.com
#   FTP_PASSWORD – паролата на този FTP акаунт
# FTP акаунтът е с директория public_html, затова server-dir е ./
name: Качване в SuperHosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v4

      - name: Качване по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public_html/
          server-dir: ./
          # базата с кодовете живее само на сървъра – не се пипа при качване
          exclude: |
            **/.git*
            **/.git*/**
            api/data/*.sqlite
            api/data/*.sqlite-*
